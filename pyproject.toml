[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-account-research"
dynamic = ["version"]
description = "Open-source CLI and MCP server that turn a company domain into a one-page GTM account brief from public sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yassine" }]
keywords = ["gtm", "sales", "outbound", "osint", "account-research", "ai-agents", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
mcp = ["mcp>=1.0"]

[project.scripts]
acr = "acr.cli:main"
acr-mcp = "acr.mcp_server:main"

[project.urls]
Homepage = "https://github.com/DrAKULA12-lab/gtm-account-research"
Issues = "https://github.com/DrAKULA12-lab/gtm-account-research/issues"

[tool.setuptools]
packages = ["acr"]

[tool.setuptools.dynamic]
version = { attr = "acr.__version__" }

[tool.setuptools.package-data]
acr = ["data/*.yml", "playbooks/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
